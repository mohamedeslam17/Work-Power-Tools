[theme]
# Supabase-inspired palette — the signature green accent, a light neutral
# (zinc) background with white cards/inputs, and near-black text.
primaryColor = "#3ecf8e"
backgroundColor = "#fafafa"
secondaryBackgroundColor = "#ffffff"
textColor = "#18181b"
font = "sans serif"

[server]
runOnSave = false

[browser]
gatherUsageStats = false

[client]
# Hide the deploy button / dev menu natively instead of via custom CSS.
toolbarMode = "minimal"
