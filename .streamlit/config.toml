[theme]
# Materials-inspection palette, not a borrowed developer-tool green: a
# tempered-steel blue (the oxide colour steel takes around 460C temper) on a
# warm graphite neutral, in both light and dark. base= supplies sane
# defaults for anything not overridden below (chart colors, widget shapes).
base = "light"
primaryColor = "#3c6e8f"
backgroundColor = "#f5f4f0"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e2328"
borderColor = "#dcd8cf"
font = "sans serif"

[theme.light]
primaryColor = "#3c6e8f"
backgroundColor = "#f5f4f0"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e2328"
borderColor = "#dcd8cf"

[theme.dark]
primaryColor = "#7fb3d1"
backgroundColor = "#12161a"
secondaryBackgroundColor = "#1b2126"
textColor = "#e9e6df"
borderColor = "#2b3238"

[server]
runOnSave = false

[browser]
gatherUsageStats = false

[client]
# Hide the deploy button / dev menu natively instead of via custom CSS.
toolbarMode = "minimal"
